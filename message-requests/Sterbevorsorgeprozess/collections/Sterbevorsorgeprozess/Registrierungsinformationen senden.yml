info:
  name: Registrierungsinformationen senden
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/engine-rest/message
  body:
    type: json
    data: |-
      {
        "messageName": "initialRegistrationInformation",
        "businessKey": "user@demo.org",
        "processVariables": {
          "username": {"value": "Demo User", "type": "String"},
          "password": {"value": "Supersecret password", "type": "String"},
          "email": {"value": "user@demo.org", "type": "String"},
          "birthday": {"value": "01.01.1970", "type": "String"},
          "idCardNumber": {"value": "L1234567", "type": "String"}
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
