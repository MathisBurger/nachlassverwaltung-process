      code: |-
        req.setBody({
          "messageName": "desiredSplitMessage",
          "businessKey": "user@demo.org",
          "processVariables": {
            "estateSplit": {"value": JSON.stringify({
            "estateObj1": {
                "hugo.habicht@demo.org": 100
            }
        }), "type": "Json"}
          }
        })

settings:
