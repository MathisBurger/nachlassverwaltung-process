info:
  name: Beerdigungspräferenzen
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/engine-rest/message
  body:
    type: json
    data: |-
      {
        "messageName": "funeralPreference",
        "businessKey": "L1234567",
        "processVariables": {
          "funeralType": {"value": "sea", "type": "String", "valueInfo": {"transient": true}},
          "maxAmountGuests": {"value": 50, "type": "Integer", "valueInfo": {"transient": true}},
          "budget": {"value": 1000000, "type": "Integer", "valueInfo": {"transient": true}}
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
