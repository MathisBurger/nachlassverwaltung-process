info:
  name: Beerdigung Aktualisieren
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/engine-rest/message
  body:
    type: json
    data: |-
      {
        "messageName": "funeralUpdate",
        "businessKey": "user@demo.org",
        "processVariables": {
          "funeralType": {"value": "sea", "type": "String", "valueInfo": {"transient": true}},
          "funeralObject": {"value": "urn", "type": "String", "valueInfo": {"transient": true}},
          "maxAmountGuests": {"value": 12, "type": "Integer", "valueInfo": {"transient": true}},
          "budget": {"value": 1000, "type": "Integer", "valueInfo": {"transient": true}}
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
