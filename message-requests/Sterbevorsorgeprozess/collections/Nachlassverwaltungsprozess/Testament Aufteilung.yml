info:
  name: Testament Aufteilung
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/engine-rest/message
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        req.setBody({
          "messageName": "updateLastWill",
          "businessKey": "L1234567",
          "processVariables": {
            "estateSplit": {"value": JSON.stringify({
            "Millionen Depot": {
                "L0000001": 75,
                "L0000002": 25
            }
        }), "type": "Json", "valueInfo": {"transient": true}}
          }
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
